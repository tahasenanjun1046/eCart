<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>eCart - Smart Price Finder</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>eCart</h1>

        <p>Smart Price Finder</p>

    </header>


    <main>

        <!-- TARGET PRICE -->

        <section class="search-section">

            <h2>Find Products Around Your Price</h2>

            <p>
                Enter a target price to find the closest products.
            </p>


            <div class="search-box">

                <input
                    type="number"
                    id="target-price"
                    placeholder="Enter target price"
                >

                <button id="search-btn">
                    Search
                </button>

            </div>

        </section>


        <!-- PRICE RANGE -->

        <section class="search-section">

            <h2>Find Products in a Price Range</h2>

            <p>
                Enter minimum and maximum prices.
            </p>


            <div class="search-box">

                <input
                    type="number"
                    id="min-price"
                    placeholder="Minimum Price"
                >

                <input
                    type="number"
                    id="max-price"
                    placeholder="Maximum Price"
                >

                <button id="range-btn">
                    Find Products
                </button>

            </div>

        </section>


        <!-- RESULTS -->

        <section>

            <h2 id="result-title">
                Closest Products
            </h2>


            <div
                id="products-container"
                class="product-grid">
            </div>

        </section>

    </main>


    <!-- PROVIDED DATA -->

    <script src="data.js"></script>

    <!-- OUR JAVASCRIPT -->

    <script src="app.js"></script>

</body>

</html>
